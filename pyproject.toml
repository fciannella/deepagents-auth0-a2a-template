[project]
name = "deepagents-auth0-a2a-template"
version = "0.1.0"
description = "Generic Deep Agents starter with Auth0 and A2A"
requires-python = ">=3.12,<3.14"
dependencies = [
  "deepagents>=0.7,<0.8",
  "langchain-openai>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2,<3",
  "PyJWT[crypto]>=2.10,<3",
  "httpx>=0.28,<1",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
